<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers Portal - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#f8f9fe] text-gray-800 font-sans min-h-screen">


    <header class="bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-8 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-xl font-bold text-indigo-900 flex items-center gap-2 hover:opacity-90 transition">
                <span
                    class="bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm font-black">B</span>
                <span>Board Jobs</span>
            </a>


            <nav class="flex items-center gap-2 md:gap-4 text-sm font-medium">
                <a href="index.html"
                    class="px-3 py-2 rounded-lg text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition">
                    offres
                </a>
                <a href="Offers_Management.html"
                    class="px-3 py-2 rounded-lg text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition">
                    admin
                </a>
            </nav>
        </div>
    </header>


    <main class="max-w-7xl mx-auto px-8 py-8">


        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Admin: Manage Offers</h1>
            </div>
            <nav
                class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 hover:bg-indigo-700 transition shadow-sm self-start sm:self-auto">
                <a href="Offer_Form.html" >+ Create New Offer</a>
        </nav>
        </div>


        <div class="relative w-full mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" placeholder="Filter offers by title or technology..."
                class="w-full pl-11 pr-4 py-3 bg-white border border-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-400 shadow-sm">
        </div>


        <div class="space-y-4">


            <div
                class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-2">
                    <div class="flex items-center gap-3">
                        <h3 class="font-bold text-gray-900 text-base">AWS Cloud Accelerator Grant</h3>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed max-w-3xl">
                        Up to $10,000 in promotional infrastructure credits for scaling early-stage B2B cloud
                        architectures over 12 months.
                    </p>
                    <div class="flex flex-wrap gap-2 pt-2">
                        <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-md font-medium">AWS</span>
                        <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-md font-medium">Cloud
                            Infrastructure</span>
                        <span
                            class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-md font-medium">DevOps</span>
                    </div>
                </div>

                <div class="flex md:flex-col items-end justify-between md:justify-start gap-4 shrink-0">
                        <div
                            class="flex items-center gap-1.5 text-xs text-indigo-600 bg-indigo-50 border border-indigo-100 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">
                            <i class="fa-regular fa-pen-to-square"></i>
                            <a href="Offer_Form.html" >Edit</a>
                    </div>
                        <button
                            class="flex items-center gap-1.5 text-xs text-red-500 bg-red-50 border border-red-100 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">
                            <i class="fa-regular fa-trash-can"></i>
                            <span>Delete</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
