<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#f8f9fe] text-gray-800 font-sans min-h-screen">

    <header class="bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-8 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-xl font-bold text-indigo-900 flex items-center gap-2 hover:opacity-90 transition">
                <span
                    class="bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm font-black">B</span>
                <span>Board Jobs</span>
            </a>


            <nav class="flex items-center gap-2 md:gap-4 text-sm font-medium">
                <a href="index.html"
                    class="px-3 py-2 rounded-lg text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition">
                    offres
                </a>
                <a href="Offers_Management.html"
                    class="px-3 py-2 rounded-lg text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition">
                    admin
                </a>
            </nav>
        </div>
    </header>


    <main class="max-w-7xl mx-auto px-8 py-8">


        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div class="relative w-full md:w-96">
                <i
                    class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" placeholder="Search offers..."
                    class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400 shadow-sm">
            </div>


            <div class="flex items-center gap-6 text-sm">
                <span class="text-gray-500 font-medium">Showing <strong class="text-gray-800">5</strong>
                    opportunities</span>
                <button
                    class="flex items-center gap-2 bg-white border border-gray-200 px-3.5 py-2 rounded-xl font-medium text-gray-700 hover:bg-gray-50 shadow-sm">
                    <i class="fa-solid fa-arrow-up-wide-short text-gray-500"></i>
                    <span>Sort: <strong>Newest</strong></span>
                </button>
            </div>
        </div>


        <div class="flex flex-wrap items-center gap-2 mb-8">
            <button class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium">All</button>
            <button
                class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50">React</button>
            <button
                class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50">Python</button>
            <button
                class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50">Node.js</button>
            <button
                class="bg-white border border-gray-200 text-gray-600 px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-50">Figma</button>
        </div>


        <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<script type="module"  src="../js/app.js" ></script>
</body>

</html>
